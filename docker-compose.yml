services:
  db:
    image: postgres:17
    container_name: cinedoors-db
    environment:
      POSTGRES_DB: cinedoors
      POSTGRES_USER: cinedoors
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copier .env.example vers .env}
    ports:
      - "5432:5432"
    volumes:
      - cinedoors-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinedoors -d cinedoors"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cinedoors-data:
